spring.application.name=tripvault

# =====================================================================================
#  Secrets: loaded from git-ignored files created by the scripts in /scripts,
#  or from environment variables (environment variables take precedence).
#    KEYSTORE_PASSWORD  -> scripts/create-keystore.ps1
#    TRIPVAULT_KEY      -> scripts/create-encryption-key.ps1
# =====================================================================================
spring.config.import=optional:file:./keystore/keystore-secret.properties,optional:file:./keystore/tripvault-key.properties

# =====================================================================================
#  HTTPS / TLS  (embedded Tomcat)
# =====================================================================================
# 8443 is the conventional HTTPS port for Java servers (443 needs admin rights).
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=file:./keystore/securedb.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${KEYSTORE_PASSWORD}
server.ssl.key-alias=securedb

# Only modern protocol versions; SSLv3, TLS 1.0 and TLS 1.1 are refused.
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# HTTP/2 over TLS for better performance.
server.http2.enabled=true

# Listen on all network interfaces so other machines on the network can connect over HTTPS.
server.address=0.0.0.0

# =====================================================================================
#  Session cookie hardening (the cookie only ever travels over HTTPS)
# =====================================================================================
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=15m

# =====================================================================================
#  Error responses: never leak internals to clients
# =====================================================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# =====================================================================================
#  Database + JPA
# =====================================================================================
# In-memory H2 database: lives inside the application's JVM, so it is not reachable over
# the network at all - the ONLY way to the data is through the HTTPS API.
spring.datasource.url=jdbc:h2:mem:tripvault;DB_CLOSE_DELAY=-1
spring.datasource.username=tripvault_app

# Tables come from schema.sql (explicit constraints); Hibernate only validates the mapping
# and never alters the schema itself.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

# Do not keep DB connections open while views render.
spring.jpa.open-in-view=false

# AES-256 key for passport encryption (Base64, 32 bytes). Never hard-coded here.
tripvault.encryption.key=${TRIPVAULT_KEY}

# =====================================================================================
#  Spring Security settings (see SecurityConfig)
# =====================================================================================
# Plain-HTTP port that only redirects to HTTPS (http://host:8080 -> https://host:8443).
tripvault.http.port=8080
tripvault.security.require-https=true

# Account lockout: 5 wrong passwords in a row lock the account for 15 minutes.
tripvault.security.max-failed-attempts=5
tripvault.security.lock-duration=15m

# Optional fixed password for the demo users; if empty, random ones are printed at startup.
tripvault.demo.password=${DEMO_PASSWORD:}
