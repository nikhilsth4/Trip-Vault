<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TripVault – Sign in</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
    <h1>TripVault</h1>

    <!-- Anti-phishing notice: teaches users what the real login looks like and that
         IT never asks for passwords by email (the attack in this scenario). -->
    <p class="notice">
        <strong>Security notice:</strong> TripVault IT will <strong>never</strong> ask for your
        password by email, phone or chat. Only sign in on this page, and check that the address
        bar shows <strong>https://</strong> and a padlock.
    </p>

    <!-- One generic message: never reveal whether the username or the password was wrong. -->
    <p class="error" th:if="${param.error}">
        Invalid username or password, or the account is temporarily locked.
    </p>
    <p class="info" th:if="${param.logout}">You have been signed out.</p>

    <!-- th:action makes Thymeleaf add the hidden CSRF token field automatically. -->
    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username"
               maxlength="50" required autofocus>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               maxlength="128" required>

        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
